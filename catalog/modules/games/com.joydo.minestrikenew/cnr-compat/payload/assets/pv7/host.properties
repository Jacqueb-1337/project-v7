# CNR's Unity input reports a 128x128 logical touch space.
touch.logicalWidth=128
touch.logicalHeight=128

# Seed the bundled Mod Manager into the private directory that the native
# compatibility layer exposes to the guest as /sdcard/CNRMods.
bootstrap.0.asset=bootstrap/CNRModManager.dll
bootstrap.0.toFilesRelative=CNRMods/CNRModManager.dll
bootstrap.0.sha256Asset=bootstrap/CNRModManager.dll.sha256
bootstrap.0.preserveCustom=true

# Seed a GitHub catalog fallback into the game's CNRMods folder once.
bootstrap.1.asset=bootstrap/repo-sources.txt
bootstrap.1.toFilesRelative=CNRMods/repo-sources.txt
bootstrap.1.sha256Asset=bootstrap/repo-sources.txt.sha256
bootstrap.1.preserveCustom=false

# Recommended CNR CNRMod 4.2.56; seed only when absent, preserving custom installations.
bootstrap.2.asset=bootstrap/CNRMod.dll
bootstrap.2.toFilesRelative=CNRMods/CNRMod.dll
bootstrap.2.sha256Asset=bootstrap/CNRMod.dll.sha256
bootstrap.2.preserveCustom=true

# Recommended CNR CNRSettingsMod 3.1.111; seed only when absent, preserving custom installations.
bootstrap.3.asset=bootstrap/CNRSettingsMod.dll
bootstrap.3.toFilesRelative=CNRMods/CNRSettingsMod.dll
bootstrap.3.sha256Asset=bootstrap/CNRSettingsMod.dll.sha256
bootstrap.3.preserveCustom=true

# Recommended CNR GraphicsSettings 0.1.1; seed only when absent, preserving custom installations.
bootstrap.4.asset=bootstrap/GraphicsSettings.dll
bootstrap.4.toFilesRelative=CNRMods/GraphicsSettings.dll
bootstrap.4.sha256Asset=bootstrap/GraphicsSettings.dll.sha256
bootstrap.4.preserveCustom=true
